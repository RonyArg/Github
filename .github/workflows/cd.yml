name: CD

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-version:
    name: Bump application version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Increment application version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          CURRENT_VERSION=$(grep -m1 -oE 'AppVersion-[0-9]+' README.md | grep -oE '[0-9]+$')

          if [ -z "$CURRENT_VERSION" ]; then
            echo "AppVersion was not found in README.md"
            exit 1
          fi

          NEXT_VERSION=$((CURRENT_VERSION + 1))
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          sed -i "0,/^[[:space:]]*AppVersion-[0-9].*$/s//AppVersion-${NEXT_VERSION} - ${TIMESTAMP}/" README.md

          git add README.md
          git commit -m "bump application version to AppVersion-${NEXT_VERSION}"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"

  validate-prod:
    name: Validate production secret
    runs-on: self-hosted
    needs: update-version

    steps:
      - name: Validate PROD_TOKEN
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if ($env:PROD_TOKEN -eq $env:LOCAL_PROD_TOKEN) {
            Write-Output "The production token is valid"
          }
          else {
            Write-Output "The production token is invalid"
            exit 1
          }